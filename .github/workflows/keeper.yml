# Runs the Vaul keeper on a schedule, so no server is needed.
#
# Setup (all from github.com, works on a phone):
#   Settings → Secrets and variables → Actions
#     Secrets:   KEEPER_PRIVATE_KEY  (dedicated keeper wallet, gas money only)
#                OPENSEA_API_KEY     (optional; empty = auto free-tier key)
#                KEEPER_SOLANA_KEY   (optional; base58 secret key, only for Solana collections)
#     Variables:  LAUNCHER, START_BLOCK, EXTERNAL_LAUNCHER — Vaul's own contracts (see config.js).
#                 The keeper does not run until LAUNCHER is set.
#   Optional variables: MAX_CEILING_ETH, CEILING_MARKUP_BPS, MIN_HARVEST_ETH
#
# Raffle snapshots are committed to snapshots/, which Vercel serves with the site.
name: keeper

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 min; GitHub may delay scheduled runs
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulate only (send no transactions)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  run:
    # Nothing to do until Vaul's own contracts are deployed and set as repo variables.
    if: ${{ vars.LAUNCHER != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: keeper/package-lock.json

      - name: Install
        working-directory: keeper
        run: npm ci

      - name: Run one keeper pass
        working-directory: keeper
        env:
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
          # Vaul's own deployment (repo variables, same as config.js).
          LAUNCHER: ${{ vars.LAUNCHER }}
          START_BLOCK: ${{ vars.START_BLOCK }}
          # Ethereum / Base / Hyperliquid / Solana collections
          EXTERNAL_LAUNCHER: ${{ vars.EXTERNAL_LAUNCHER }}
          KEEPER_SOLANA_KEY: ${{ secrets.KEEPER_SOLANA_KEY }}
          COLLECTIONS_FILE: ../collections.json
          MAX_CEILING_ETH: ${{ vars.MAX_CEILING_ETH || '0.5' }}
          CEILING_MARKUP_BPS: ${{ vars.CEILING_MARKUP_BPS || '300' }}
          MIN_HARVEST_ETH: ${{ vars.MIN_HARVEST_ETH || '0.005' }}
          # Live on the schedule; simulate only when a manual run ticks "dry_run".
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          SNAPSHOT_DIR: ../snapshots
        run: node src/index.js --once

      - name: Publish new raffle snapshots
        run: |
          if [ -n "$(git status --porcelain snapshots)" ]; then
            git config user.name "vaul-keeper"
            git config user.email "keeper@users.noreply.github.com"
            git add snapshots
            git commit -m "keeper: publish raffle snapshots"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
